    <meta name="theme-color" content="#fbfbfa" />
    <script>
      // 3D giriş kendiliğinden anasayfanın her 3 açılışında bir oynar: 1., 4., 7. … açılış (yenileme dahil).
      // Sayaç yalnızca anasayfanın tam yüklenişinde artar (site içi menüyle anasayfaya dönmek sayfayı yüklemez, sayılmaz).
      // Hareket azaltma, veri tasarrufu ya da zayıf cihazda hiç oynamaz; altbilgideki "Girişi izle" her zaman çalışır.
      // Anasayfada giriş koyu zeminde başlar: JS yüklenene kadar açık renk parlama olmasın.
      window.__ftIntro = (function () {
        if (location.pathname !== '/') return false
        var due = true
        try {
          var ls = localStorage
          var count = parseInt(ls.getItem('ft-home-loads') || '', 10)
          // önceki sürümlerde girişi görmüş ziyaretçi 1. açılışını yapmış sayılır (sıradaki giriş 4. açılışta)
          if (isNaN(count)) count = ls.getItem('ft-intro-seen-v1') || ls.getItem('ft-visits') ? 1 : 0
          count += 1
          ls.setItem('ft-home-loads', String(count))
          // önceki sürümün ziyaret sayacı artık kullanılmıyor
          ls.removeItem('ft-visits')
          ls.removeItem('ft-last-active')
          due = count % 3 === 1
        } catch (e) {}
        if (!due) return false
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) return false
        var n = navigator
        if (n.connection && n.connection.saveData) return false
        if ((n.deviceMemory && n.deviceMemory <= 2) || (n.hardwareConcurrency && n.hardwareConcurrency <= 2)) return false
        return true
      })()
      // Giriş oynayacaksa: koyu zemin + ön-render içeriği giriş katmanı gelene kadar gizli (index.css → .ft-intro)
      if (window.__ftIntro) {
        document.documentElement.style.background = '#0a0c0f'
        document.documentElement.classList.add('ft-intro')
      }
      // JS çalışıyor: kaydırmayla çizilen teknik çizimler çizilmemiş başlasın (index.css → .js .plot)
      document.documentElement.classList.add('js')
    </script>

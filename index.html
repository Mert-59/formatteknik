    <meta name="theme-color" content="#fbfbfa" />
    <!-- Uygulama olarak kurulum (PWA): public/manifest.webmanifest; simgeler public/icons/ (Formatlogo.pdf'ten üretildi) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Format Teknik" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script>
      // 3D giriş, anasayfa her açıldığında kendiliğinden oynar (yenileme dahil; site içi menüyle anasayfaya dönmek sayfayı yüklemez).
      // Hareket azaltma, veri tasarrufu ya da zayıf cihazda oynamaz; altbilgideki "Girişi izle" her zaman çalışır.
      // Anasayfada giriş koyu zeminde başlar: JS yüklenene kadar açık renk parlama olmasın.
      window.__ftIntro = (function () {
        // önceki sürümlerin giriş sayaçları artık kullanılmıyor: ziyaretçinin tarayıcısından temizlenir
        try {
          ;['ft-home-loads', 'ft-visits', 'ft-last-active', 'ft-intro-seen-v1'].forEach(function (k) { localStorage.removeItem(k) })
        } catch (e) {}
        if (location.pathname !== '/') return false
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) return false
        var n = navigator
        if (n.connection && n.connection.saveData) return false
        if ((n.deviceMemory && n.deviceMemory <= 2) || (n.hardwareConcurrency && n.hardwareConcurrency <= 2)) return false
        return true
      })()
      // Giriş oynayacaksa: koyu zemin + ön-render içeriği giriş katmanı gelene kadar gizli (index.css → .ft-intro)
      if (window.__ftIntro) {
        document.documentElement.style.background = '#0a0c0f'
        document.documentElement.classList.add('ft-intro')
      }
      // JS çalışıyor: kaydırmayla çizilen teknik çizimler çizilmemiş başlasın (index.css → .js .plot)
      document.documentElement.classList.add('js')
    </script>

    />
